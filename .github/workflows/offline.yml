name: Offline reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  saved-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: safeguards verify --full
      - run: python -m pytest -q
      - run: safeguards reproduce --output /tmp/safeguards-results
